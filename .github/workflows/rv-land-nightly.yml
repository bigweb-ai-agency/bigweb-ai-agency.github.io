name: RV Land nightly discovery
on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rv-land/scripts/**'
      - 'rv-land/requirements.txt'
      - '.github/workflows/rv-land-nightly.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: rv-land-data-publish
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r rv-land/requirements.txt
      - run: python -m unittest discover -s rv-land/tests -v
      - name: Public source discovery
        id: source
        continue-on-error: true
        run: python rv-land/scripts/nightly.py
      - name: Validate retained records
        run: python rv-land/scripts/validate_data.py
      - name: Commit only generated data
        run: |
          git config user.name "rv-land-watch"
          git config user.email "rv-land-watch@users.noreply.github.com"
          git add rv-land/data/listings.json rv-land/data/states.json rv-land/data/monitor.json rv-land/assets/listings
          if ! git diff --cached --quiet; then
            git commit -m "RV Land: nightly discovery and source checks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Surface source failure
        if: steps.source.outcome == 'failure'
        run: exit 1
